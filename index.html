<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#013753" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Daphi Gonen — Adoption before scale." />
  <title>Daphi Gonen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baumans&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#013753;
      --navy-2:#0a4968;
      --cream:#f5efe2;
      --ink:#10212b;
      --white:#fffdfa;
      --line:rgba(1,55,83,.16);
      --shadow:0 18px 50px rgba(8,30,44,.16);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:28px 16px}
    .card{width:min(100%,430px);background:var(--white);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(1,55,83,.08)}
    .hero{background:var(--navy);color:white;text-align:center;padding:34px 28px 28px}
    .portrait{width:118px;height:118px;border-radius:50%;object-fit:cover;object-position:center top;border:4px solid var(--cream);box-shadow:0 8px 24px rgba(0,0,0,.18);display:block;margin:0 auto 18px}
    h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:700}
    .tagline{margin:9px 0 0;color:rgba(255,255,255,.86);font-size:16px;letter-spacing:.01em}
    .body{padding:20px}
    .actions{display:grid;gap:10px}
    .action{display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--ink);background:white;border:1px solid var(--line);border-radius:16px;padding:14px 15px;min-height:58px;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
    .action:hover{transform:translateY(-1px);border-color:rgba(1,55,83,.35);box-shadow:0 8px 22px rgba(1,55,83,.08)}
    .icon{width:30px;height:30px;border-radius:10px;background:var(--cream);color:var(--navy);display:grid;place-items:center;flex:0 0 auto;font-size:15px;font-weight:700}
    .text{min-width:0}
    .label{display:block;font-size:12px;color:#66757d;margin-bottom:2px}
    .value{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
    .dutchess{font-family:Baumans,Inter,sans-serif;font-size:17px;letter-spacing:.01em}
    .save{margin-top:14px;display:flex;justify-content:center;align-items:center;text-decoration:none;background:var(--navy);color:white;border-radius:16px;padding:15px 18px;font-weight:700;letter-spacing:.01em}
    .save:hover{background:var(--navy-2)}
    .footer{text-align:center;font-size:11px;color:#7b878d;padding:4px 8px 2px}
    @media (prefers-color-scheme: dark){
      :root{
        --cream:#111821;
        --white:#17212b;
        --ink:#f3f0e8;
        --line:rgba(255,255,255,.11);
        --shadow:0 18px 50px rgba(0,0,0,.32);
      }
      html,body{background:#0f151b}
      .card{background:var(--white);border-color:rgba(255,255,255,.06)}
      .action{background:#1a252f;color:var(--ink)}
      .label,.footer{color:#aab5bb}
      .icon{background:#26343f;color:#d8edf6}
      .save{background:#013753}
    }
    @media (max-width:360px){h1{font-size:27px}.hero{padding-inline:20px}.body{padding:16px}}
  </style>
</head>
<body>
  <main class="card" aria-label="Digital business card for Daphi Gonen">
    <section class="hero">
      <img class="portrait" alt="Daphi Gonen" src="portrait.jpg.jpeg" />
      <h1>Daphi Gonen</h1>
      <p class="tagline">Adoption before scale.</p>
    </section>

    <section class="body">
      <div class="actions">
        <a class="action" href="tel:+972522956160">
          <span class="icon">☎</span>
          <span class="text"><span class="label">Phone</span><span class="value">052-295-6160</span></span>
        </a>

        <a class="action" href="mailto:daphneygo@gmail.com">
          <span class="icon">✉</span>
          <span class="text"><span class="label">Email</span><span class="value">daphneygo@gmail.com</span></span>
        </a>

        <a class="action" href="https://agenticdutchess.substack.com/" target="_blank" rel="noopener">
          <span class="icon">A</span>
          <span class="text"><span class="label">Writing &amp; research</span><span class="value dutchess">Agentic Dutchess</span></span>
        </a>

        <a class="action" href="https://www.linkedin.com/in/daphigonen/">
          <span class="icon">in</span>
          <span class="text"><span class="label">Professional profile</span><span class="value">LinkedIn</span></span>
        </a>
      </div>

      <a class="save" download="Daphi-Gonen.vcf"
         href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3AGonen%3BDaphi%3B%3B%3B%0AFN%3ADaphi%20Gonen%0ATEL%3BTYPE%3DCELL%3A%2B972522956160%0AEMAIL%3BTYPE%3DINTERNET%3Adaphneygo%40gmail.com%0AEND%3AVCARD">
        Save contact
      </a>

      <p class="footer">One scan. Everything you need.</p>
    </section>
  </main>
</body>
</html>
